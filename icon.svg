<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#ffffff"/>

  <!-- Sector rojo (resto: N -> E -> S -> W, 270deg) -->
  <path d="M 256 76 A 180 180 0 1 1 76 256
           L 166 256 A 90 90 0 1 0 256 166 Z"
        fill="#e74c3c" opacity="0.55"/>
  <!-- Sector amarillo (270-300) -->
  <path d="M 76 256 A 180 180 0 0 1 100.12 166
           L 178.06 211 A 90 90 0 0 0 166 256 Z"
        fill="#f1c40f" opacity="0.55"/>
  <!-- Sector verde central (300-330, centrado en NW) -->
  <path d="M 100.12 166 A 180 180 0 0 1 166 100.12
           L 211 178.06 A 90 90 0 0 0 178.06 211 Z"
        fill="#2ecc71" opacity="0.55"/>
  <!-- Sector amarillo (330-360) -->
  <path d="M 166 100.12 A 180 180 0 0 1 256 76
           L 256 166 A 90 90 0 0 0 211 178.06 Z"
        fill="#f1c40f" opacity="0.55"/>

  <!-- Cardinal letters -->
  <g fill="#16334d" font-family="Arial, sans-serif" font-weight="700" font-size="40" text-anchor="middle">
    <text x="256" y="100">N</text>
    <text x="256" y="430">S</text>
    <text x="100" y="270">O</text>
    <text x="412" y="270">E</text>
  </g>

  <!-- Flecha triangular verde apuntando al centro (desde el NW) -->
  <g transform="translate(256 256) rotate(-45)">
    <polygon points="-34,-180 34,-180 0,-70" fill="#2ecc71" stroke="#0f5c2e" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Punto central -->
  <circle cx="256" cy="256" r="14" fill="#2ecc71" stroke="#0f5c2e" stroke-width="3"/>
</svg>