<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2c3e"/>
      <stop offset="100%" stop-color="#0b1320"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Compass ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#263448" stroke-width="10"/>
  <!-- Cardinal letters -->
  <g fill="#8aa0bb" font-family="Arial, sans-serif" font-weight="700" font-size="40" text-anchor="middle">
    <text x="256" y="100">N</text>
    <text x="256" y="430">S</text>
    <text x="100" y="270">O</text>
    <text x="412" y="270">E</text>
  </g>
  <!-- Ideal sector NW-W (highlight) -->
  <path d="M 256 256 L 256 76 A 180 180 0 0 0 128.4 128.4 Z" fill="#2ecc71" opacity="0.35"/>
  <!-- Arrow (from NW) -->
  <g transform="translate(256 256) rotate(315)">
    <polygon points="0,-180 -20,-130 -6,-130 -6,160 6,160 6,-130 20,-130" fill="#4ea1ff"/>
  </g>
  <circle cx="256" cy="256" r="18" fill="#4ea1ff"/>
</svg>
