             C 70 95, 150 55, 230 55
             C 290 55, 335 80, 345 110
             C 345 120, 335 122, 320 118
             C 270 102, 210 100, 170 112
             C 145 120, 130 130, 120 142
             C 115 148, 108 152, 100 152
             C 88 152, 78 148, 70 142
             Q 55 155, 60 150 Z"/>
    <!-- Suspentes -->
    <g stroke="#000" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="228" y1="240" x2="95"  y2="195"/>
      <line x1="228" y1="240" x2="135" y2="178"/>
      <line x1="228" y1="240" x2="175" y2="170"/>
      <line x1="234" y1="238" x2="248" y2="100"/>
      <line x1="240" y1="238" x2="270" y2="95"/>
      <line x1="246" y1="240" x2="295" y2="100"/>
    </g>
    <!-- Piloto -->
    <g transform="translate(228 250)">
      <ellipse cx="0" cy="0" rx="18" ry="22"/>
      <circle cx="-2" cy="-28" r="10"/>
      <path d="M -6 18 Q -10 38 -16 55 L -10 58 Q -4 40 0 22 Z"/>
      <path d="M 6 18 Q 10 40 6 60 L 12 62 Q 16 42 14 22 Z"/>
      <path d="M 12 -8 Q 24 -2 28 8 L 22 12 Q 16 4 8 0 Z"/>
