<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hoy se vuela">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7fc4ff"/>
      <stop offset="55%" stop-color="#4ea1ff"/>
      <stop offset="100%" stop-color="#3e8bd8"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5ec27a"/>
      <stop offset="100%" stop-color="#2f8c4f"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe9f7"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff7c2"/>
      <stop offset="70%" stop-color="#ffd95a"/>
      <stop offset="100%" stop-color="#ffd95a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Cielo (de borde a borde) -->
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- Sol suave (esquina superior derecha, dentro del area segura maskable) -->
    <circle cx="400" cy="138" r="62" fill="url(#sun)"/>
    <circle cx="400" cy="138" r="30" fill="#ffe680"/>

    <!-- Nubes blancas (puffs) -->
    <g fill="#ffffff" opacity="0.95">
      <!-- Nube grande izquierda -->
      <ellipse cx="118" cy="172" rx="46" ry="22"/>
      <ellipse cx="156" cy="158" rx="34" ry="26"/>
      <ellipse cx="92"  cy="178" rx="28" ry="18"/>
      <!-- Nube pequena derecha -->
      <ellipse cx="332" cy="208" rx="30" ry="14"/>
      <ellipse cx="356" cy="200" rx="22" ry="16"/>
    </g>

    <!-- Campo verde con horizonte curvo -->
    <path d="M 0 360 Q 256 300 512 360 L 512 512 L 0 512 Z" fill="url(#field)"/>
    <!-- Sombra suave del horizonte -->
    <path d="M 0 360 Q 256 300 512 360" stroke="rgba(20,40,80,0.12)" stroke-width="3" fill="none"/>
    <!-- Detalle de hierba/colinas -->
    <path d="M 0 420 Q 130 388 260 412 T 512 408 L 512 460 L 0 460 Z" fill="rgba(20,80,40,0.18)"/>

    <!-- Parapente: vela + lineas + piloto -->
    <g transform="translate(256 248)">
      <!-- Sombra suave de la vela sobre el cielo -->
      <ellipse cx="0" cy="22" rx="118" ry="10" fill="rgba(0,0,0,0.12)"/>

      <!-- Vela (arco) con celdas -->
      <path d="M -120 10 Q 0 -78 120 10 L 100 22 Q 0 -52 -100 22 Z" fill="url(#wing)" stroke="#1f4a7a" stroke-width="3" stroke-linejoin="round"/>
      <!-- Separadores de celdas -->
      <g stroke="#1f4a7a" stroke-width="2" opacity="0.55">
        <line x1="-78" y1="-10" x2="-72" y2="14"/>
        <line x1="-40" y1="-30" x2="-38" y2="6"/>
        <line x1="0"   y1="-40" x2="0"   y2="0"/>
        <line x1="40"  y1="-30" x2="38"  y2="6"/>
        <line x1="78"  y1="-10" x2="72"  y2="14"/>
      </g>
      <!-- Stabilo color (toque verde) -->
      <path d="M -120 10 Q -110 0 -100 22 Z" fill="#2ecc71"/>
      <path d="M 120 10 Q 110 0 100 22 Z" fill="#2ecc71"/>

      <!-- Lineas de suspension -->
      <g stroke="#1f2c3e" stroke-width="1.6" fill="none" opacity="0.85">
        <line x1="-90" y1="18" x2="-12" y2="86"/>
        <line x1="-55" y1="8"  x2="-8"  y2="86"/>
        <line x1="-20" y1="0"  x2="-4"  y2="86"/>
        <line x1="20"  y1="0"  x2="4"   y2="86"/>
        <line x1="55"  y1="8"  x2="8"   y2="86"/>
        <line x1="90"  y1="18" x2="12"  y2="86"/>
      </g>

      <!-- Piloto (silueta) -->
      <g transform="translate(0 96)">
        <!-- Silla/arnes -->
        <rect x="-16" y="-8" width="32" height="22" rx="6" fill="#1f4a7a"/>
        <!-- Casco -->
        <circle cx="0" cy="-16" r="9" fill="#1f4a7a"/>
        <!-- Piernas -->
        <path d="M -10 14 L -16 36 M 10 14 L 16 36" stroke="#1f4a7a" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>