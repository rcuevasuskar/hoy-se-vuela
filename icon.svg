<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#ffffff"/>

  <!-- Sector rojo (30° -> 240°, 210°) -->
  <path d="M 346 100.12 A 180 180 0 1 1 100.12 346
           L 178.06 301 A 90 90 0 1 0 301 178.06 Z"
        fill="#ef3b2c"/>
  <!-- Sector amarillo izquierda (240° -> 285°, 45°) -->
  <path d="M 100.12 346 A 180 180 0 0 1 82.14 209.42
           L 169.07 232.71 A 90 90 0 0 0 178.06 301 Z"
        fill="#ffd60a"/>
  <!-- Sector verde NW (285° -> 345°, 60°) -->
  <path d="M 82.14 209.42 A 180 180 0 0 1 209.42 82.14
           L 232.71 169.07 A 90 90 0 0 0 169.07 232.71 Z"
        fill="#1fd16a"/>
  <!-- Sector amarillo derecha (345° -> 30°, 45°) -->
  <path d="M 209.42 82.14 A 180 180 0 0 1 346 100.12
           L 301 178.06 A 90 90 0 0 0 232.71 169.07 Z"
        fill="#ffd60a"/>

  <!-- Flecha triangular verde apuntando al centro (desde el NW) -->
  <g transform="translate(256 256) rotate(-45)">
    <polygon points="-34,-180 34,-180 0,-70" fill="#16a85a" stroke="#0a4f2a" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
